<form id="watch-url-form" class="watch-url-form">
<label for="watch-video-url">Video URL<input id="watch-video-url" type="url" placeholder="https://example.com/video.mp4" required></label>
<label for="watch-subtitle-url">Subtitle URL (optional, SRT or VTT)<input id="watch-subtitle-url" type="url" placeholder="https://example.com/subtitles.vtt"></label>
<button id="watch-url-load" type="submit" class="secondary">Load &amp; Play</button>
</form>
<form id="watch-save-form" class="watch-save-form" hidden>
<label for="watch-save-title">Video name<input id="watch-save-title" maxlength="200" required></label>
<button id="watch-save-submit" type="submit" class="secondary">Add to page</button>
</form>
