<div id="watch-height-editor" class="owner-subtitle-height" data-position-editor="true">
<span>Ենթագրերի բարձրություն</span>
<button id="watch-height-up" type="button" class="secondary">↑ Վերև</button>
<button id="watch-height-down" type="button" class="secondary">↓ Ներքև</button>
<output id="watch-height-value" aria-live="polite">10%</output>
<button id="watch-height-save" type="button" class="secondary" disabled>Պահել դիրքը</button>
<span id="watch-height-status" role="status" aria-live="polite"></span>
</div>
